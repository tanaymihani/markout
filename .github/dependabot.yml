# Python dependencies are pinned in requirements.lock and moved deliberately with
# `make lock` (and a full test run); Dependabot only watches the actions and the base image.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # the lock pins wheels for Python 3.11; moving Python is a deliberate change, not a bump
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
