# Wheels with the C++ fill engine for Linux, macOS and Windows, built and tested on every version tag, on any
# push that changes the packaging, or by hand from the Actions tab. Publishing to PyPI (tags only) is off until
# it is set up: add a trusted publisher on PyPI for this repository and workflow (environment "pypi"), then set
# the repository variable PYPI_PUBLISH to "true".
name: wheels

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["setup.py", "pyproject.toml", "MANIFEST.in", "cpp/**", ".github/workflows/wheels.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
