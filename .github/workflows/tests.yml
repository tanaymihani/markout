name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpp]"
      - name: Build the C++ extension
        run: |
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release \
                -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -DPython_EXECUTABLE="$(which python)"
          cmake --build build/cpp -j
      - name: Test
        # tests that need the downloaded datasets skip themselves; everything else runs,
        # including the C++ vs Python equivalence tests on randomized event streams
        run: python -m pytest -q
