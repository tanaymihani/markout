[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markout"
version = "0.1.0"
description = "Does a short-horizon edge survive costs, fills, and competition?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "polars>=1.0",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "statsmodels>=0.14",
  "arch>=6.3",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
data = ["kaggle>=1.6", "yfinance>=0.2"]
cpp = ["pybind11>=2.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "data: needs downloaded datasets (skipped when missing)",
  "slow: takes more than ~30 s",
]
