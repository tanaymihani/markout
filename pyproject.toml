[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markout"
version = "0.1.0"
description = "Does a short-horizon edge survive costs, fills, and competition?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tanay Mihani" }]
requires-python = ">=3.11"
keywords = [
  "market microstructure",
  "limit order book",
  "fill simulation",
  "backtesting",
  "deflated sharpe ratio",
  "kelly criterion",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: C++",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "polars>=1.0",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "statsmodels>=0.14",
  "arch>=6.3",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "tqdm>=4.66",
]

[project.urls]
Homepage = "https://tanaymihani.github.io/markout/"
Source = "https://github.com/tanaymihani/markout"
Issues = "https://github.com/tanaymihani/markout/issues"

[project.scripts]
markout = "markout.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6", "pre-commit>=3.7"]
data = ["kaggle>=1.6", "yfinance>=0.2"]
cpp = ["pybind11>=2.12"]
demo = ["playwright>=1.40", "imageio-ffmpeg>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = [
  "data: needs downloaded datasets (skipped when missing)",
  "slow: takes more than ~30 s",
  "e2e: drives a real browser (pytest -m e2e; needs playwright and Chrome or Chromium)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "build", "reports", "docs/api"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E501",   # long lines: the formatter wraps code; long strings and URLs are left alone
  "E731",   # small named lambdas are used deliberately in reports and tests
  "B905",   # zip() without strict=: lengths are equal by construction where it matters
  "SIM108", # ternaries are not always clearer than an if/else block
]

[tool.ruff.lint.isort]
known-first-party = ["markout"]

[tool.mypy]
python_version = "3.11"
files = ["src/markout"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# no type information shipped (pandas-stubs and scipy-stubs are not used)
module = ["pandas.*", "scipy.*", "sklearn.*", "statsmodels.*", "yfinance.*", "pyarrow.*", "lightgbm.*", "arch.*"]
ignore_missing_imports = true
